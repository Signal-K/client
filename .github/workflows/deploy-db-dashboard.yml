name: Deploy db dashboard to Cloudflare

# KES-550: static PocketBase metrics dashboard at https://db.starsailors.space.
# Separate Worker (starsailors-db-dashboard, assets only) so it never touches
# the app Worker, its KV, queues or secrets. Uses the same Cloudflare repo
# secrets as the app deploy and needs no PocketBase or Clerk secrets: the
# browser signs in with the PocketBase superuser account.
on:
  push:
    branches: [main, master]
    paths:
      - "apps/db-dashboard/**"
      - ".github/workflows/deploy-db-dashboard.yml"
  workflow_dispatch: {}

concurrency:
  group: cloudflare-db-dashboard
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/db-dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/db-dashboard/package-lock.json

      - run: npm ci

      - run: npm run build

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/db-dashboard
          command: deploy
