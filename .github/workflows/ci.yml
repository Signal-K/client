name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Unit tests
        run: yarn test:unit

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest

    services:
      pocketbase:
        image: ghcr.io/muchobien/pocketbase:latest
        env:
          PB_ADMIN_EMAIL: ci@example.com
          PB_ADMIN_PASSWORD: "Ci-TestPassword123!"
        ports:
          - 8095:8090
        options: >-
          --health-cmd "wget --spider -q http://localhost:8090/api/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Import PocketBase schema
        run: |
          POCKETBASE_URL=http://localhost:8095 \
          POCKETBASE_ADMIN_EMAIL=ci@example.com \
          POCKETBASE_ADMIN_PASSWORD="Ci-TestPassword123!" \
            node --experimental-strip-types scripts/pocketbase/import-schema.ts

      - name: Build
        run: yarn build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CI_NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_POCKETBASE_URL: http://localhost:8095

      - name: E2E tests
        run: yarn test:e2e:headless
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CI_NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CI_CLERK_SECRET_KEY }}
          NEXT_PUBLIC_POCKETBASE_URL: http://localhost:8095
          POCKETBASE_URL: http://localhost:8095
          POCKETBASE_ADMIN_EMAIL: ci@example.com
          POCKETBASE_ADMIN_PASSWORD: "Ci-TestPassword123!"
          CYPRESS_baseUrl: http://localhost:3000
