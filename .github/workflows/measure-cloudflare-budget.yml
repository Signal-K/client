name: Measure Cloudflare Free-plan budget (SSC-38)

# Manual. Sends the representative anonymous, authenticated read, mutation and
# refresh requests to a deployed Worker while `wrangler tail` records each
# invocation's CPU time and outcome. Writes the table to the job summary and
# uploads the raw JSON. Fails when any route errors, hits Error 1102, uses more
# than 10 ms CPU or more than 50 subrequests.
#
# Authenticated flows need `session_id`: an active Clerk session of a test
# account (in the browser console on the target host: `Clerk.session.id`).
# The job mints a fresh session JWT per request with CLERK_SECRET_KEY.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Which deployment to measure
        type: choice
        options:
          - staging
          - production
        default: staging
      session_id:
        description: Clerk session id of a test account (optional; authenticated flows are skipped without it)
        type: string
        required: false
      samples:
        description: Requests per route
        type: string
        default: "5"

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Measure
        run: |
          node scripts/cloudflare/measure-budget.mjs \
            --base "${{ inputs.target == 'staging' && 'https://staging.starsailors.space' || 'https://starsailors.space' }}" \
            ${{ inputs.target == 'staging' && '--env staging' || '' }} \
            --tail --samples "${{ inputs.samples }}" --out budget.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          BUDGET_SESSION_ID: ${{ inputs.session_id }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: budget-${{ inputs.target }}
          path: budget.json
          if-no-files-found: ignore
