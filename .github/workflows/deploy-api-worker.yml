name: Deploy API Worker (SSC-35)

# Manual only. The API Worker (workers/api) serves /api/v1/* same-origin and
# must stay inside the Workers Free plan. Configuration comes from GitHub:
#   vars:    CLERK_ISSUER, CLERK_AUTHORIZED_PARTIES(_STAGING)
#   secrets: POCKETBASE_URL, POCKETBASE_ADMIN_EMAIL, POCKETBASE_ADMIN_PASSWORD
# Existing Worker secrets survive `wrangler deploy`; each secret write publishes
# a new Worker version, so only tick sync_secrets when a secret actually changed.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Which Worker to deploy
        type: choice
        options:
          - staging
          - production
        default: staging
      sync_secrets:
        description: Write the PocketBase secrets (first deploy or after rotation)
        type: boolean
        default: false

concurrency:
  group: deploy-api-worker-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      TARGET_ARGS: ${{ inputs.target == 'staging' && '--env staging' || '' }}
      PARTIES: ${{ inputs.target == 'staging' && vars.CLERK_AUTHORIZED_PARTIES_STAGING || vars.CLERK_AUTHORIZED_PARTIES }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Validate configuration
        run: |
          missing=()
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLERK_ISSUER PARTIES; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing GitHub secrets/variables: ${missing[*]}"
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLERK_ISSUER: ${{ vars.CLERK_ISSUER }}

      - name: Test and typecheck the Worker
        run: |
          npx vitest run workers/api
          npx tsc --noEmit -p .

      - name: Deploy and write secrets
        if: inputs.sync_secrets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/api
          secrets: |
            POCKETBASE_URL
            POCKETBASE_ADMIN_EMAIL
            POCKETBASE_ADMIN_PASSWORD
          command: deploy ${{ env.TARGET_ARGS }} --var CLERK_ISSUER:${{ vars.CLERK_ISSUER }} --var CLERK_AUTHORIZED_PARTIES:${{ env.PARTIES }}
        env:
          POCKETBASE_URL: ${{ secrets.POCKETBASE_URL }}
          POCKETBASE_ADMIN_EMAIL: ${{ secrets.POCKETBASE_ADMIN_EMAIL }}
          POCKETBASE_ADMIN_PASSWORD: ${{ secrets.POCKETBASE_ADMIN_PASSWORD }}

      - name: Deploy (keep existing secrets)
        if: ${{ !inputs.sync_secrets }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/api
          command: deploy ${{ env.TARGET_ARGS }} --var CLERK_ISSUER:${{ vars.CLERK_ISSUER }} --var CLERK_AUTHORIZED_PARTIES:${{ env.PARTIES }}
