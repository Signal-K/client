name: Staging playtest lifecycle (SSC-33)

# Manual only. Deploys this ref to the staging Worker, enables the guarded
# playtest endpoint for the duration of the run, plays the browser flow with a
# throwaway Clerk account, and always removes the endpoint secrets afterwards.
# Staging shares the production Clerk/PocketBase instance, so the endpoint must
# never stay enabled between runs.
on:
  push:
    branches: [ssc-33-playtest-ci]
  workflow_dispatch: {}

concurrency:
  group: cloudflare-staging
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/open-next-worker.yml
    secrets: inherit
    with:
      wrangler_command: deploy --env staging
      wrangler_env_args: --env staging

  playtest:
    needs: deploy
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_PLAYTEST_AUTH_SECRET: ${{ secrets.STAGING_PLAYTEST_AUTH_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Require the operator secret
        run: test -n "$STAGING_PLAYTEST_AUTH_SECRET" || { echo "::error::Set the STAGING_PLAYTEST_AUTH_SECRET Actions secret first."; exit 1; }

      - name: Enable the playtest endpoint on staging only
        run: |
          printf '%s' "true" | npx wrangler secret put STAGING_PLAYTEST_AUTH_ENABLED --env staging
          printf '%s' "$STAGING_PLAYTEST_AUTH_SECRET" | npx wrangler secret put STAGING_PLAYTEST_AUTH_SECRET --env staging

      - name: Run the playtest lifecycle
        run: yarn cypress run --spec cypress/e2e/staging-playtest.cy.ts
        env:
          CYPRESS_baseUrl: https://staging.starsailors.space
          STAGING_PLAYTEST_AUTH_ENABLED: "true"

      - name: Disable the playtest endpoint
        if: always()
        run: |
          npx wrangler secret delete STAGING_PLAYTEST_AUTH_ENABLED --env staging --force
          npx wrangler secret delete STAGING_PLAYTEST_AUTH_SECRET --env staging --force

      - name: Upload Cypress artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-staging-playtest
          path: |
            cypress/screenshots
            cypress/videos
          if-no-files-found: ignore
