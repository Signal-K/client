name: Staging playtest lifecycle (SSC-33)

# Runs on pushes to ssc-33-playtest-ci or manually. Deploys this ref's API Worker (workers/api) to staging, enables the guarded
# playtest endpoint for the duration of the run, plays the browser flow with a
# throwaway Clerk account, and always removes the endpoint secrets afterwards.
# Staging shares the production Clerk/PocketBase instance, so the endpoint must
# never stay enabled between runs.
# On the edge branch it is called by the staging deploy workflow once the deploy
# finishes (so a deploy can never cancel it); dispatch it by hand otherwise.
on:
  workflow_call: {}
  workflow_dispatch: {}

jobs:

  playtest:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_PLAYTEST_AUTH_SECRET: ${{ secrets.STAGING_PLAYTEST_AUTH_SECRET }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      POCKETBASE_URL: ${{ secrets.POCKETBASE_URL }}
      POCKETBASE_ADMIN_EMAIL: ${{ secrets.POCKETBASE_ADMIN_EMAIL }}
      POCKETBASE_ADMIN_PASSWORD: ${{ secrets.POCKETBASE_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Require the operator secret
        run: test -n "$STAGING_PLAYTEST_AUTH_SECRET" || { echo "::error::Set the STAGING_PLAYTEST_AUTH_SECRET Actions secret first."; exit 1; }

      - name: Test the Worker
        run: npx vitest run workers/api

      - name: Deploy the staging API Worker with the playtest endpoint enabled
        working-directory: workers/api
        run: |
          npx wrangler deploy --env staging --var CLERK_ISSUER:${{ vars.CLERK_ISSUER }} --var CLERK_AUTHORIZED_PARTIES:${{ vars.CLERK_AUTHORIZED_PARTIES_STAGING }}
          for name in POCKETBASE_URL POCKETBASE_ADMIN_EMAIL POCKETBASE_ADMIN_PASSWORD CLERK_SECRET_KEY STAGING_PLAYTEST_AUTH_SECRET; do
            printf '%s' "${!name}" | npx wrangler secret put "$name" --env staging
          done
          printf '%s' "true" | npx wrangler secret put STAGING_PLAYTEST_AUTH_ENABLED --env staging

      - name: Run the playtest lifecycle
        run: yarn cypress run --spec cypress/e2e/staging-playtest.cy.ts
        env:
          CYPRESS_baseUrl: https://staging.starsailors.space
          STAGING_PLAYTEST_AUTH_ENABLED: "true"

      - name: Disable the playtest endpoint
        if: always()
        run: |
          cd workers/api
          for name in STAGING_PLAYTEST_AUTH_ENABLED STAGING_PLAYTEST_AUTH_SECRET CLERK_SECRET_KEY; do
            npx wrangler secret delete "$name" --env staging < <(yes)
          done

      - name: Upload Cypress artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-staging-playtest
          path: |
            cypress/screenshots
            cypress/videos
          if-no-files-found: ignore
