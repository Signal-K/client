name: Deploy to Cloudflare Workers

# SSC-31: static Next.js export on Workers Static Assets plus the thin app
# Worker (workers/app) for /api/*. See docs/runbooks/cloudflare-cutover.md.
#
# Frequent main commits are expected. Cancel superseded runs so only the latest
# code publishes, and never `wrangler secret put` here (that publishes an extra
# Worker version per secret and caused Error 1102 on 2026-09-18).
on:
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "yarn.lock"
      - "next.config.*"
      - "wrangler.jsonc"
      - "workers/**"
      - "scripts/cloudflare/**"
      - "tsconfig.json"
      - "postcss.config.*"
      - "tailwind.config.*"
      - "components.json"
      - ".github/workflows/deploy-cloudflare.yml"
      - ".github/workflows/cloudflare-app-worker.yml"
  workflow_dispatch: {}

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    uses: ./.github/workflows/cloudflare-app-worker.yml
    secrets: inherit
    with:
      wrangler_command: deploy
      wrangler_env_args: ""
