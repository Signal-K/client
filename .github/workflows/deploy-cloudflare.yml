name: Deploy to Cloudflare Workers

# Client is a full Next.js app (API routes, server actions, server-side
# Pocketbase admin auth) -- not a static SPA like Atlas, so this deploys via
# the OpenNext Cloudflare adapter (Workers + Assets), not cloudflare/pages-action.
#
# Frequent main commits are expected. Cancel superseded runs so only the latest
# code publishes, and never `wrangler secret put` here (that publishes an extra
# Worker version per secret and caused Error 1102 on 2026-09-18).
on:
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "yarn.lock"
      - "next.config.*"
      - "wrangler.jsonc"
      - "open-next.config.*"
      - "tsconfig.json"
      - "postcss.config.*"
      - "tailwind.config.*"
      - "components.json"
      - ".github/workflows/deploy-cloudflare.yml"
      - ".github/workflows/open-next-worker.yml"
  workflow_dispatch: {}

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    uses: ./.github/workflows/open-next-worker.yml
    secrets: inherit
    with:
      wrangler_command: deploy
      wrangler_env_args: ""
