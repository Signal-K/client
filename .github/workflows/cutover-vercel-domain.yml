name: Cut over Star Sailors domain to Vercel

on:
  workflow_dispatch:
    inputs:
      target:
        description: Domain to cut over after its Vercel deployment passed
        required: true
        type: choice
        options: [staging, production]

jobs:
  cutover:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Validate cutover credentials
        run: |
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required repository secret: $name"
              exit 1
            fi
          done

      - name: Detach the OpenNext Worker domain and point DNS at Vercel
        env:
          TARGET: ${{ inputs.target }}
        run: |
          if [ "$TARGET" = staging ]; then
            domain=staging.starsailors.space
            worker=starsailors-client-staging
          else
            domain=starsailors.space
            worker=starsailors-client
          fi

          # Register before changing DNS. The deploy workflow has already
          # assigned the staging alias (or --prod assigned production), but
          # this makes a missing project-domain configuration fail early.
          if ! npx --yes vercel@latest domains inspect "$domain" >/dev/null 2>&1; then
            npx --yes vercel@latest domains add "$domain" "$VERCEL_PROJECT_ID"
          fi

          domains="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains?hostname=$domain")"
          domain_id="$(echo "$domains" | jq -r --arg domain "$domain" --arg worker "$worker" '.result[] | select(.hostname == $domain and .service == $worker) | .id' | head -1)"
          if [ -n "$domain_id" ] && [ "$domain_id" != null ]; then
            curl --fail-with-body --silent --show-error -X DELETE \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains/$domain_id" | jq -e '.success == true'
          fi

          zone_id="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=starsailors.space" | jq -r '.result[0].id')"
          test -n "$zone_id" && test "$zone_id" != null
          record_id="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records?type=CNAME&name=$domain" | jq -r '.result[0].id // empty')"
          payload="$(jq -nc --arg name "$domain" '{type:"CNAME",name:$name,content:"cname.vercel-dns.com",ttl:1,proxied:false}')"
          if [ -n "$record_id" ]; then
            curl --fail-with-body --silent --show-error -X PUT \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$payload" \
              "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records/$record_id" | jq -e '.success == true'
          else
            curl --fail-with-body --silent --show-error -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$payload" \
              "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records" | jq -e '.success == true'
          fi
