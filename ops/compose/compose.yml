services:
  # Next.js application
  nextapp:
    container_name: nextapp
    build:
      context: ../..
      dockerfile: ops/docker/next.dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ../../.env.local
    environment:
      - NODE_ENV=development
    volumes:
      - ../../:/app
      - /app/node_modules
      - /app/.next
    working_dir: /app
    networks:
      - app-network
    restart: unless-stopped
    # Simple command to start the development server
    command: "yarn dev"

  # E2E Testing Service
  e2e-tests:
    container_name: e2e-tests
    build:
      context: ../..
      dockerfile: ops/docker/test.dockerfile
    ports:
      - "3001:3000"  # Different port to avoid conflicts
    env_file:
      - ../../.env.local
    environment:
      - NODE_ENV=test
      - SKIP_USER_CREATION_TESTS=true
      - CYPRESS_baseUrl=http://nextapp:3000
    volumes:
      - ../../:/app
      - /app/node_modules
      - /app/.next
      - /app/.cypress
    working_dir: /app
    networks:
      - app-network
    depends_on:
      - nextapp
    profiles:
      - test
    # Override default command for different test types
    command: "yarn test:e2e:headless"

  # Pocketbase - replacing Supabase-hosted Postgres (see .claude/plans/sparkling-cooking-dewdrop.md, Phase 2)
  pocketbase:
    container_name: pocketbase
    image: ghcr.io/muchobien/pocketbase:latest
    ports:
      - "8095:8090"
    volumes:
      - pocketbase-data:/pb_data
      - ../../pocketbase/pb_hooks:/pb_hooks
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8090/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: Flask service (uncomment if needed)
  # flask:
  #   container_name: flask
  #   build:
  #     context: ./citizen
  #     dockerfile: Dockerfile
  #   ports:
  #     - "5001:5001"
  #   environment:
  #     - FLASK_APP=app.py
  #     - FLASK_ENV=development
  #   volumes:
  #     - ./citizen:/app
  #   working_dir: /app
  #   networks:
  #     - app-network

networks:
  app-network:
    driver: bridge

volumes:
  pocketbase-data:
