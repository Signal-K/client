services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: navigation-postgres-prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-navigation}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ../../init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    profiles:
      - legacy-migration

  # PocketBase application database and file storage.
  # Keep this service private; only the Next.js server needs its admin API.
  pocketbase:
    container_name: starsailors-pocketbase-prod
    image: ghcr.io/muchobien/pocketbase:latest
    expose:
      - "8090"
    volumes:
      - pocketbase_data_prod:/pb_data
      - ../../pocketbase/pb_hooks:/pb_hooks:ro
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8090/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # Next.js Application (Production)
  nextapp:
    container_name: nextapp-prod
    build:
      context: ../..
      dockerfile: ops/docker/Dockerfile.prod
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - POCKETBASE_URL=${POCKETBASE_URL:-http://pocketbase:8090}
      - POCKETBASE_ADMIN_EMAIL=${POCKETBASE_ADMIN_EMAIL:?POCKETBASE_ADMIN_EMAIL must be set}
      - POCKETBASE_ADMIN_PASSWORD=${POCKETBASE_ADMIN_PASSWORD:?POCKETBASE_ADMIN_PASSWORD must be set}
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY must be set}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY:?CLERK_SECRET_KEY must be set}
      - CLERK_WEBHOOK_SIGNING_SECRET=${CLERK_WEBHOOK_SIGNING_SECRET:?CLERK_WEBHOOK_SIGNING_SECRET must be set}
      # Add other production environment variables
    depends_on:
      pocketbase:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    command: >
      sh -c "
        echo 'Starting production application...' &&
        node server.js
      "

  # Nginx reverse proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../ssl:/etc/nginx/ssl:ro
    depends_on:
      - nextapp
    networks:
      - app-network
    restart: unless-stopped
    profiles:
      - proxy

volumes:
  postgres_data_prod:
  pocketbase_data_prod:

networks:
  app-network:
    driver: bridge
